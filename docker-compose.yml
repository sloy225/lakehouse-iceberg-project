services:
  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    container_name: lakehouse-minio
    restart: unless-stopped
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    container_name: lakehouse-catalog
    restart: unless-stopped
    depends_on:
      - minio
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3a://lakehouse-warehouse/warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    ports:
      - "8181:8181"

  spark-iceberg:
    image: quay.io/jupyter/pyspark-notebook:spark-3.5.0
    container_name: lakehouse-spark
    restart: unless-stopped
    depends_on:
      - minio
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: us-east-1
      JUPYTER_TOKEN: lakehouse
    ports:
      - "8888:8888"
      - "4040:4040"
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./spark-defaults/spark-defaults.conf:/usr/local/spark/conf/spark-defaults.conf
    command: start-notebook.py --IdentityProvider.token='lakehouse'
  
  trino:
    image: trinodb/trino:464
    container_name: lakehouse-trino
    restart: unless-stopped
    depends_on:
      - minio
      - iceberg-rest
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY} 
      AWS_REGION: us-east-1
    ports:
      - "8081:8080"
    volumes:
      - ./trino-config:/etc/catalogs
      - ./trino/catalog/lakehouse.properties:/etc/trino/catalog/lakehouse.properties

  metabase:
    image: metabase/metabase:latest
    container_name: lakehouse-bi
    restart: unless-stopped
    depends_on:
      - trino
    ports:
      - "3000:3000"
    volumes:
      - metabase_data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db

volumes:
  minio_data:
  metabase_data: